name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      # THIS STEP FIXES THE PERMISSION DENIED ERROR
      - name: Fix Capacitor Permissions
        run: chmod +x ./node_modules/.bin/cap

      - name: Build Web Assets
        run: npm run build

      # Use 'npm exec' instead of 'npx' for better reliability in CI
      - name: Sync Capacitor
        run: npm exec cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shield-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk