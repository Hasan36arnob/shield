name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to run the build manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java (Required for Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu' # or 'temurin'
          java-version: '21'    # Capacitor 7 requires Java 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      # IMPORTANT: Capacitor looks for the 'www' folder. 
      # If your project uses a framework (React/Vue), run your build command here.
      # Since your project is plain HTML, we just ensure the directory exists.
      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shield-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk